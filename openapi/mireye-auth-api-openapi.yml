openapi: 3.1.0
info:
  title: Mireye Earth Ask Auth API
  description: Provenance-tagged geospatial data for US coordinates. POST /v1/fetch for deterministic field values; POST /v1/ask for natural-language Q&A; GET /v1/meta/fields for the catalog.
  version: 0.14.0
tags:
- name: Auth
paths:
  /v1/auth/login:
    post:
      summary: Login
      operationId: login_v1_auth_login_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
      tags:
      - Auth
components:
  schemas:
    LoginResponse:
      properties:
        user:
          additionalProperties: true
          type: object
          title: User
        settings:
          additionalProperties: true
          type: object
          title: Settings
        created:
          type: boolean
          title: Created
      type: object
      required:
      - user
      - settings
      - created
      title: LoginResponse
