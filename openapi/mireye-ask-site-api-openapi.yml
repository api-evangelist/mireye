openapi: 3.1.0
info:
  title: Mireye Earth Ask Ask Site API
  description: Provenance-tagged geospatial data for US coordinates. POST /v1/fetch for deterministic field values; POST /v1/ask for natural-language Q&A; GET /v1/meta/fields for the catalog.
  version: 0.14.0
tags:
- name: Ask Site
paths:
  /v1/ask-site:
    post:
      summary: Ask Site
      description: 'Answer a question about a registered site — ONE Opus call over the

        persisted dossier. Never re-fetches; the sieve ran once at register time.'
      operationId: ask_site_v1_ask_site_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskSiteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Ask Site
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    AskSiteRequest:
      properties:
        site_id:
          type: string
          maxLength: 64
          minLength: 4
          title: Site Id
        question:
          type: string
          maxLength: 2000
          minLength: 1
          title: Question
      type: object
      required:
      - site_id
      - question
      title: AskSiteRequest
